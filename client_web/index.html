<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Avid Mahjong — Web Client</title>
<style>
  :root {
    --bg: #0b352a; --gold: #e7c46a; --ink: #f2efe6; --muted: #9fc4b4;
    --accent: #1f8a6d; --red: #d23b3b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 50% 40%, #1a6b52, var(--bg));
    color: var(--ink);
    font: 14px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }

  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #08271d; border-bottom: 1px solid #1d5b48; flex: 0 0 auto; }
  header h1 { font-size: 15px; margin: 0; color: var(--gold); letter-spacing: .5px; }
  header .info { color: var(--muted); font-size: 12px; }
  header .info b { color: var(--ink); }
  header label { color: var(--muted); font-size: 12px; user-select: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: #777; }
  .dot.on { background: #3ad07a; box-shadow: 0 0 6px #3ad07a; } .dot.off { background: #d24b4b; }
  header .spacer { flex: 1; }
  button.ctl { background: #14543f; color: var(--ink); border: 1px solid #2a7a60; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  button.ctl:hover { background: #1c6e51; }

  main { flex: 1; display: flex; min-height: 0; }
  #tableWrap { flex: 1; position: relative; min-width: 0; display: flex; flex-direction: column; }
  #playarea { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 10px; }

  /* square felt */
  .felt {
    position: relative; width: min(100%, 82vh); aspect-ratio: 1;
    background: radial-gradient(circle at 50% 50%, #19654d 0%, #124a39 70%, #0e3e2f 100%);
    border-radius: 18px; box-shadow: inset 0 0 60px rgba(0,0,0,.45), 0 8px 30px rgba(0,0,0,.4);
    border: 1px solid rgba(0,0,0,.4);
  }

  /* four player stations, each fills the felt and is rotated so its local bottom = that player's edge */
  .station { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 5px; padding: 8px; pointer-events: none; }
  .station[data-rel="0"] { transform: rotate(0deg); }
  .station[data-rel="1"] { transform: rotate(-90deg); }
  .station[data-rel="2"] { transform: rotate(180deg); }
  .station[data-rel="3"] { transform: rotate(90deg); }

  .pond { display: grid; grid-template-columns: repeat(6, auto); gap: 2px; justify-content: center; align-content: start;
          min-height: calc(20px * 1.36 * 3 + 12px); }   /* room for ~3 rows */
  .melds { display: flex; gap: 4px; min-height: 0; flex-wrap: wrap; justify-content: center; }
  .meldgroup { display: flex; gap: 1px; padding: 1px; border-radius: 4px; background: rgba(0,0,0,.18); }
  .hand { display: flex; gap: 3px; align-items: flex-end; justify-content: center; flex-wrap: nowrap; }

  /* center "well": round / remaining wall / dead-wall with dora (Mahjong Soul style) */
  .well { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 26%; aspect-ratio: 1;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-align: center;
          background: linear-gradient(160deg, rgba(8,42,31,.92), rgba(5,24,18,.94)); border: 1px solid rgba(231,196,106,.3);
          border-radius: 14px; box-shadow: 0 0 30px rgba(0,0,0,.5) inset, 0 6px 22px rgba(0,0,0,.45); }
  .well .wround { font-size: 2.1vh; color: var(--gold); font-weight: 800; letter-spacing: 1px; }
  .well .wcount { font-size: 1.5vh; color: var(--ink); font-variant-numeric: tabular-nums; }
  .well .wlbl { font-size: .95vh; color: var(--muted); margin-top: 5px; letter-spacing: 1px; }
  .well .deadwall { display: flex; gap: 1px; align-items: center; }
  .well .deadwall .tile { --w: 17px; margin-bottom: 2px; }

  /* score chips around the well, facing each player (replaces corner badges → no tile occlusion) */
  .scorechip { position: absolute; display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 999px;
               background: linear-gradient(135deg, rgba(16,44,35,.97), rgba(8,26,20,.97)); border: 1px solid rgba(231,196,106,.2);
               white-space: nowrap; pointer-events: auto; box-shadow: 0 3px 10px rgba(0,0,0,.45); transition: box-shadow .25s, border-color .25s; }
  .scorechip.active { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(231,196,106,.55); }
  .scorechip .sc-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
               font-size: 13px; font-weight: 800; color: #fff; flex: 0 0 auto; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  .sc-dot.w1 { background: radial-gradient(circle at 35% 28%, #ef7d63, #c0392b); }
  .sc-dot.w2 { background: radial-gradient(circle at 35% 28%, #54bd81, #2e8b57); }
  .sc-dot.w3 { background: radial-gradient(circle at 35% 28%, #62a0dd, #2f6fb0); }
  .sc-dot.w4 { background: radial-gradient(circle at 35% 28%, #b095d8, #6f4fa0); }
  .scorechip.dealer .sc-dot { box-shadow: 0 0 0 2px var(--gold), inset 0 0 0 1px rgba(255,255,255,.3); }
  .scorechip .sc-pts { color: #f4efe0; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; letter-spacing: .5px;
    text-shadow: 1px 0 0 rgba(0,0,0,.6), -1px 0 0 rgba(0,0,0,.6), 0 1px 0 rgba(0,0,0,.6), 0 -1px 0 rgba(0,0,0,.6), 0 0 5px rgba(0,0,0,.4);
    transition: color .25s, text-shadow .25s; }
  .scorechip.gain .sc-pts { color: #87e6a0; text-shadow: 0 0 9px rgba(135,230,160,.9), 1px 0 0 rgba(0,0,0,.5), -1px 0 0 rgba(0,0,0,.5); }
  .scorechip.loss .sc-pts { color: #ff8c7a; text-shadow: 0 0 9px rgba(255,140,122,.9), 1px 0 0 rgba(0,0,0,.5), -1px 0 0 rgba(0,0,0,.5); }
  .scorechip.gain .sc-pts, .scorechip.loss .sc-pts { animation: ptsPop .35s ease-out; }
  @keyframes ptsPop { 0% { transform: scale(1); } 45% { transform: scale(1.28); } 100% { transform: scale(1); } }
  .scorechip.me { border-color: rgba(231,196,106,.45); }
  .scorechip .sc-rii { color: var(--red); font-weight: 800; font-size: 13px; }
  /* each chip is centered on a point just outside one well edge; side chips are
     rotated (like their player's station) so they don't reach into the pond */
  .scorechip[data-rel="0"] { left: 50%; top: 100%; transform: translate(-50%,-50%); margin-top: 17px; }
  .scorechip[data-rel="2"] { left: 50%; top: 0;    transform: translate(-50%,-50%); margin-top: -17px; }
  .scorechip[data-rel="1"] { left: 100%; top: 50%; transform: translate(-50%,-50%) rotate(-90deg); margin-left: 22px; }
  .scorechip[data-rel="3"] { left: 0;    top: 50%; transform: translate(-50%,-50%) rotate(90deg);  margin-left: -22px; }
  .scorechip.anim-riichi { animation: badgeFlash .85s ease-in-out 2; }


  /* ── 3D tiles ── */
  .tile { --w: 24px; width: var(--w); aspect-ratio: 3 / 4; position: relative; flex: 0 0 auto;
    border-radius: 4px; background-repeat: no-repeat; background-position: center; background-size: 100% 100%;
    margin-bottom: 4px; pointer-events: auto;
    box-shadow: 0 1px 0 #e6ddc6, 0 2px 0 #d3c8a6, 0 3px 0 #c0b48d, 0 4px 5px rgba(0,0,0,.5); }
  .tile::before { content: ""; position: absolute; inset: 0; border-radius: 4px; pointer-events: none;
    background: linear-gradient(155deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,.06) 30%, rgba(255,255,255,0) 52%); }
  .tile.back { background-image: url(/tiles/Back.svg); }
  .pond .tile { --w: 20px; }
  .melds .tile { --w: 20px; }
  .station[data-rel="0"] .hand .tile { --w: 46px;
    box-shadow: 0 1px 0 #efe7d2, 0 2px 0 #e2d9be, 0 4px 0 #d3c8a6, 0 6px 0 #c0b48d, 0 9px 10px rgba(0,0,0,.5); margin-bottom: 8px; }
  .station[data-rel="0"] .hand .tile.clickable { cursor: pointer; transition: transform .12s ease; }
  .station[data-rel="0"] .hand .tile.clickable:hover { transform: translateY(-12px); }
  .station[data-rel="0"] .hand .tile.drawn { margin-left: 16px; }
  .tile.sel { z-index: 3; box-shadow: 0 0 0 2px var(--gold), 0 10px 16px rgba(0,0,0,.55); }
  .station[data-rel="0"] .hand .tile.sel { transform: translateY(-16px); }
  .station:not([data-rel="0"]) .hand .tile { --w: 22px; }

  /* most-recent (in-play) discard */
  .tile.cur { z-index: 2; box-shadow: 0 1px 0 #d3c8a6, 0 2px 0 #c0b48d, 0 0 0 2px var(--gold), 0 0 12px 3px rgba(231,196,106,.85); animation: curPulse 1.1s ease-in-out infinite; }
  @keyframes curPulse { 0%,100% { box-shadow: 0 2px 0 #c0b48d, 0 0 0 2px var(--gold), 0 0 7px 1px rgba(231,196,106,.6); } 50% { box-shadow: 0 2px 0 #c0b48d, 0 0 0 2px var(--gold), 0 0 16px 5px rgba(231,196,106,.95); } }

  /* animations (local frame — rotation orients them per player) */
  @keyframes inLocal { from { transform: translateY(26px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  .anim-in { animation: inLocal .32s cubic-bezier(.2,1.1,.3,1); }
  @keyframes meldPop { 0% { transform: scale(.2) translateY(26px); opacity: 0; } 65% { transform: scale(1.15); } 100% { transform: none; opacity: 1; } }
  .anim-meld { animation: meldPop .44s cubic-bezier(.2,1.5,.4,1); }
  @keyframes drawBounce { 0% { transform: translateY(-26px) scale(1.1); opacity: .2; } 55% { transform: translateY(6px); } 100% { transform: none; } }
  .anim-draw { animation: drawBounce .5s ease-out; }
  @keyframes badgeFlash { 0%,100% { box-shadow: none; } 50% { box-shadow: 0 0 0 2px var(--red) inset, 0 0 16px rgba(210,59,59,.6); } }

  /* ── action bar + burning fuse ── */
  #actionbar { flex: 0 0 auto; min-height: 72px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: flex-end; padding: 10px 20px; background: linear-gradient(0deg, #06201a, #0a3024); border-top: 1px solid #1d5b48; }
  #actionbar .hint { color: var(--muted); font-size: 13px; margin-right: auto; }
  button.act { position: relative; border: none; border-radius: 999px; padding: 11px 22px; cursor: pointer; font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #fff;
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(180deg, #2aa17f, #16855f);
    box-shadow: 0 4px 0 rgba(0,0,0,.32), 0 7px 14px rgba(0,0,0,.42); transition: transform .08s, filter .12s; }
  button.act:hover { filter: brightness(1.1); }
  button.act:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.32), 0 3px 8px rgba(0,0,0,.42); }
  button.act.pass { background: linear-gradient(180deg, #7d8b84, #54635c); }
  button.act.call { background: linear-gradient(180deg, #f0b052, #d2882a); color: #2a1a05; }
  button.act.riichi { background: linear-gradient(180deg, #f4d764, #d6a92c); color: #2a1f04; }
  button.act.win { background: linear-gradient(180deg, #ef6b6b, #c0392b); animation: winGlow 1s ease-in-out infinite; }
  button.act.riichi.armed { box-shadow: 0 0 0 3px #fff inset, 0 4px 0 rgba(0,0,0,.32), 0 0 16px rgba(244,215,100,.8); filter: brightness(1.12); }
  .tile.dimmed { opacity: .32; filter: grayscale(.6); cursor: default !important; }
  .station[data-rel="0"] .hand .tile.dimmed:hover { transform: none; }
  @keyframes winGlow { 0%,100% { box-shadow: 0 4px 0 rgba(0,0,0,.32), 0 0 12px rgba(232,90,90,.55); } 50% { box-shadow: 0 4px 0 rgba(0,0,0,.32), 0 0 24px rgba(232,90,90,.95); } }
  button.act .mini { display: inline-flex; gap: 3px; align-items: flex-end; }
  button.act .mini .tile { --w: 24px; margin-bottom: 3px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }

  .fuse-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .fuse-wrap .ftxt { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .fuse-wrap .secs { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--gold); width: 3em; text-align: right; }
  .fuse { position: relative; width: 240px; height: 16px; border-radius: 8px; background: repeating-linear-gradient(90deg, #b9863a 0 7px, #caa45a 7px 14px); box-shadow: inset 0 0 0 1px rgba(0,0,0,.3); }
  .fuse .char { position: absolute; top: 0; right: 0; bottom: 0; width: 0%; background: linear-gradient(90deg, #1a130c, #2a2018); border-radius: 0 8px 8px 0; }
  .fuse .flame { position: absolute; top: -10px; font-size: 20px; transform: translateX(-50%); filter: drop-shadow(0 0 5px #ff9b2e); pointer-events: none; }
  .fuse.reserve { background: repeating-linear-gradient(90deg, #c0392b 0 7px, #e05a4a 7px 14px); box-shadow: inset 0 0 0 1px rgba(0,0,0,.3), 0 0 12px rgba(210,59,59,.7); }

  /* call announcement banner (碰/吃/杠/立直/荣和/自摸) */
  .cbwrap { position: absolute; z-index: 25; pointer-events: none; }
  .cbwrap.rel0 { left: 50%; bottom: 17%; transform: translateX(-50%); }
  .cbwrap.rel2 { left: 50%; top: 17%; transform: translateX(-50%); }
  .cbwrap.rel1 { right: 12%; top: 50%; transform: translateY(-50%); }
  .cbwrap.rel3 { left: 12%; top: 50%; transform: translateY(-50%); }
  .callbanner { font-size: 5.2vh; font-weight: 900; letter-spacing: 3px; color: #fff;
    -webkit-text-stroke: 1.5px rgba(0,0,0,.55); text-shadow: 0 3px 0 rgba(0,0,0,.45), 0 0 22px rgba(255,255,255,.35);
    transform-origin: center; animation: callIn 1.05s cubic-bezier(.2,1.4,.4,1) forwards; }
  .cb-pon, .cb-kan { color: #ffcf6a; } .cb-chi { color: #8fe3a0; } .cb-riichi { color: var(--gold); } .cb-ron, .cb-tsumo { color: #ff8a6a; }
  @keyframes callIn { 0% { transform: scale(.3) rotate(-12deg); opacity: 0; } 22% { transform: scale(1.2) rotate(-7deg); opacity: 1; } 70% { transform: scale(1) rotate(-7deg); opacity: 1; } 100% { transform: scale(1) rotate(-7deg); opacity: 0; } }

  /* ── log panel ── */
  #logpanel { width: 340px; flex: 0 0 auto; background: #07211a; border-left: 1px solid #1d5b48; display: flex; flex-direction: column; min-height: 0; }
  #logpanel.hidden { display: none; }
  #logpanel .loghead { padding: 8px 12px; border-bottom: 1px solid #1d5b48; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 6px 10px; font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  #log .row { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.04); white-space: pre-wrap; word-break: break-word; }
  #log .in { color: #7fd6ff; } #log .out { color: #ffd479; } #log .sys { color: #8aa; } #log .tag { opacity: .7; }

  /* ── loading screen (one-time asset preload) ── */
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, #1a6b52, #0b352a); z-index: 40; transition: opacity .4s; }
  #loading.done { opacity: 0; pointer-events: none; }
  .loadbox { text-align: center; }
  .loadtitle { color: var(--gold); font-size: 18px; margin-bottom: 14px; letter-spacing: 1px; }
  .loadbar { width: 280px; height: 12px; border-radius: 6px; background: rgba(0,0,0,.4); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(231,196,106,.3); }
  .loadfill { height: 100%; width: 0%; background: linear-gradient(90deg, #b9863a, var(--gold)); transition: width .15s; }
  .loadpct { color: var(--muted); font-size: 12px; margin-top: 8px; font-variant-numeric: tabular-nums; }

  /* ── overlay ── */
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.55); z-index: 30; }
  #overlay.show { display: flex; }
  .card { background: #0f4536; border: 1px solid var(--gold); border-radius: 16px; padding: 22px 30px; min-width: 290px; max-width: 460px; text-align: center; box-shadow: 0 12px 48px rgba(0,0,0,.55); animation: cardIn .35s cubic-bezier(.2,1.3,.4,1); }
  @keyframes cardIn { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  .card h2 { margin: 0 0 8px; color: var(--gold); }
  .card .yaku { text-align: left; margin: 12px 0; }
  .card .yaku div { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.08); padding: 3px 0; }
  .card .big { font-size: 32px; color: var(--ink); margin: 10px 0; font-variant-numeric: tabular-nums; }
  .card table { width: 100%; font-variant-numeric: tabular-nums; margin-top: 8px; } .card td { padding: 2px 6px; }

  /* rotate hint (portrait phones) */
  #rotateHint { display: none; position: absolute; inset: 0; z-index: 70; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; background: rgba(6,28,22,.92); color: var(--ink); text-align: center; }
  #rotateHint .rot { font-size: 46px; animation: rotSpin 2s ease-in-out infinite; }
  #rotateHint small { color: var(--muted); }
  @keyframes rotSpin { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(78deg); } }

  /* ── mobile / touch layout (Mahjong-Soul-style: landscape, table fills screen) ── */
  @media (max-width: 900px), (pointer: coarse) {
    header { padding: 4px 8px; gap: 8px; min-height: 0; }
    header h1 { font-size: 13px; }
    header .info { display: none; }                 /* ws url / verbose info — info lives in the well */
    header label, header button.ctl { font-size: 12px; padding: 4px 9px; }
    #playarea { padding: 3px; }
    .felt { width: min(100%, calc(100vh - 92px)); }
    /* log panel becomes a slide-over drawer (hidden by default via JS on mobile) */
    #logpanel:not(.hidden) { position: fixed; top: 0; right: 0; bottom: 0; width: min(88%, 340px); z-index: 60; box-shadow: -4px 0 22px rgba(0,0,0,.55); }
    /* scale tiles to the viewport so a full hand fits one row */
    .tile { --w: 3.4vmin; }
    .pond .tile, .melds .tile { --w: 3.3vmin; }
    .station[data-rel="0"] .hand .tile { --w: 6vmin; }
    .station:not([data-rel="0"]) .hand .tile { --w: 3vmin; }
    .well .deadwall .tile { --w: 2.6vmin; }
    button.act .mini .tile { --w: 4vmin; }
    .well { width: 30%; }
    .well .wround { font-size: 3vmin; } .well .wcount { font-size: 2.2vmin; } .well .wlbl { font-size: 1.6vmin; }
    .scorechip { padding: 2px 8px 2px 3px; gap: 4px; }
    .scorechip .sc-pts { font-size: 2.5vmin; }
    .scorechip .sc-dot { width: 4vmin; height: 4vmin; font-size: 2.3vmin; }
    #actionbar { min-height: 52px; padding: 7px 10px; gap: 8px; }
    button.act { padding: 9px 15px; font-size: 14px; }
    .fuse { width: 130px; }
    /* perf: cheaper shadows + no continuously-repainting shadow animations on mobile GPUs */
    .tile { box-shadow: 0 2px 0 #c0b48d, 0 3px 4px rgba(0,0,0,.4); }
    .tile::before { display: none; }
    .station[data-rel="0"] .hand .tile { box-shadow: 0 2px 0 #c0b48d, 0 4px 6px rgba(0,0,0,.45); }
    .tile.cur { animation: none; box-shadow: 0 0 0 2px var(--gold), 0 0 9px rgba(231,196,106,.75); }
    button.act.win { animation: none; }
    button.act .mini .tile { filter: none; }
  }
  @media (pointer: coarse) and (orientation: portrait) { #rotateHint.on { display: flex; } }
</style>
</head>
<body>
<header>
  <h1>🀄 Avid Mahjong</h1>
  <span class="dot off" id="conndot"></span>
  <span class="info" id="conninfo">未连接</span>
  <span class="info" id="gameinfo"></span>
  <span class="spacer"></span>
  <label><input type="checkbox" id="timerOn" checked> 限时</label>
  <button class="ctl" id="snapBtn" title="向服务器请求一次完整快照">刷新</button>
  <button class="ctl" id="reconnectBtn">重连</button>
  <button class="ctl" id="logBtn">隐藏日志</button>
</header>

<main>
  <div id="tableWrap">
    <div id="playarea">
      <div class="felt" id="felt">
        <div class="station" data-rel="2"><div class="pond"></div><div class="melds"></div><div class="hand"></div></div>
        <div class="station" data-rel="1"><div class="pond"></div><div class="melds"></div><div class="hand"></div></div>
        <div class="station" data-rel="3"><div class="pond"></div><div class="melds"></div><div class="hand"></div></div>
        <div class="station" data-rel="0"><div class="pond"></div><div class="melds"></div><div class="hand"></div></div>
        <div class="well" id="well">
          <div class="wround" id="wround"></div>
          <div class="wcount" id="wcount"></div>
          <div class="wlbl">宝牌 ▸ 牌山</div>
          <div class="deadwall" id="deadwall"></div>
          <div class="scorechip" data-rel="0"></div>
          <div class="scorechip" data-rel="1"></div>
          <div class="scorechip" data-rel="2"></div>
          <div class="scorechip" data-rel="3"></div>
        </div>
      </div>
    </div>
    <div id="actionbar"><span class="hint">等待连接…</span></div>
    <div id="overlay"><div class="card" id="overlayCard"></div></div>
    <div id="rotateHint"><div class="rot">📱</div><div>横屏体验更佳</div><small>（点此忽略）</small></div>
    <div id="loading"><div class="loadbox">
      <div class="loadtitle">🀄 加载牌面资源…</div>
      <div class="loadbar"><div class="loadfill" id="loadfill"></div></div>
      <div class="loadpct" id="loadpct">0%</div>
    </div></div>
  </div>

  <div id="logpanel">
    <div class="loghead">
      <b>协议日志</b><span style="flex:1"></span>
      <label><input type="checkbox" id="logEvents" checked> events</label>
      <button class="ctl" id="clearLog" style="padding:2px 8px">清空</button>
    </div>
    <div id="log"></div>
  </div>
</main>

<script>
"use strict";

// Mahjong-Soul-style clock: 5s base per decision + a 20s "long-think" reserve
// pool that refills each hand and is consumed only after the base runs out.
const BASE_MS = 5000, RESERVE_FULL_MS = 20000;
const CALL_LABEL = { chi:"吃", pon:"碰", minkan:"杠", ankan:"杠", shouminkan:"杠", kan:"杠", riichi:"立直", ron:"荣和", tsumo:"自摸" };
const WINDS = ["", "東", "南", "西", "北"];
const FACE = {
  m: ["", "Man1","Man2","Man3","Man4","Man5","Man6","Man7","Man8","Man9"],
  p: ["", "Pin1","Pin2","Pin3","Pin4","Pin5","Pin6","Pin7","Pin8","Pin9"],
  s: ["", "Sou1","Sou2","Sou3","Sou4","Sou5","Sou6","Sou7","Sou8","Sou9"],
  z: ["", "Ton","Nan","Shaa","Pei","Haku","Hatsu","Chun"],
};
const RED_FACE = { m: "Man5-Dora", p: "Pin5-Dora", s: "Sou5-Dora" };
const ABORT_NAMES = { nine_terminals:"九種九牌", four_winds:"四風連打", four_kans:"四開槓", four_riichi:"四家立直", triple_ron:"三家和了", wall_empty:"荒牌流局" };
const KIND_LABEL = { discard:"切", pass:"过", chi:"吃", pon:"碰", kan:"杠", tsumo:"自摸", ron:"荣和", riichi:"立直", abort:"流局" };

let ws = null, yourSeat = 0, seatNames = ["E","S","W","N"], ruleset = "?";
let snap = null, pendingActions = null, globalLastDiscard = null, riichiArmed = false;
let reserveMs = RESERVE_FULL_MS;   // long-think pool, refilled each hand
const ptsShown = {};               // seat -> currently displayed score (for change tween)
const scoreTweens = {};            // seat -> active rAF id
let selectedTileId = null;         // mobile two-step discard: first tap selects, second confirms
const seenDiscardIds = new Set(), seenMeldKeys = new Set(), animatedDrawIds = new Set();
let prevRiichi = {};

const logEl = document.getElementById("log");
function log(dir, obj) {
  if (dir === "in" && obj && obj.type === "event" && !document.getElementById("logEvents").checked) return;
  const row = document.createElement("div"); row.className = "row " + dir;
  const t = new Date().toLocaleTimeString("en-GB");
  const arrow = dir === "in" ? "← " : dir === "out" ? "→ " : "  ";
  row.innerHTML = `<span class="tag">${t} ${arrow}</span>${escapeHtml(typeof obj==="string"?obj:JSON.stringify(obj))}`;
  logEl.appendChild(row); logEl.scrollTop = logEl.scrollHeight;
  while (logEl.children.length > 600) logEl.removeChild(logEl.firstChild);
}
function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function wsUrl() { return (location.protocol==="https:"?"wss:":"ws:") + "//" + location.host + "/"; }
function connect() {
  if (ws && (ws.readyState===WebSocket.OPEN || ws.readyState===WebSocket.CONNECTING)) return;
  const url = wsUrl(); setConn(false, "连接中… "+url); log("sys","connecting "+url);
  ws = new WebSocket(url);
  ws.onopen = () => { setConn(true, "已连接 "+url); log("sys","open"); };
  ws.onclose = (e) => { setConn(false, "已断开 (code "+e.code+")"); log("sys","close "+e.code); cancelTimer(); };
  ws.onerror = () => log("sys","error");
  ws.onmessage = (ev) => { let m; try { m = JSON.parse(ev.data); } catch { log("sys","bad json"); return; } log("in",m); handle(m); };
}
function send(obj) { if (ws && ws.readyState===WebSocket.OPEN) { ws.send(JSON.stringify(obj)); log("out",obj); } }
function setConn(on, txt) { document.getElementById("conndot").className = "dot "+(on?"on":"off"); document.getElementById("conninfo").textContent = txt; }

function handle(msg) {
  switch (msg.type) {
    case "welcome":
      yourSeat = msg.your_seat; seatNames = msg.seats; ruleset = msg.ruleset;
      seenDiscardIds.clear(); seenMeldKeys.clear(); animatedDrawIds.clear(); globalLastDiscard = null; prevRiichi = {}; reserveMs = RESERVE_FULL_MS;
      for (const k in ptsShown) delete ptsShown[k]; for (const k in scoreTweens) delete scoreTweens[k];
      setTimeout(() => send({type:"request_snapshot"}), 150); break;
    case "snapshot": snap = msg; scheduleRender(); break;
    case "event": applyEvent(msg.event); scheduleRender(); break;
    case "decision":
      pendingActions = msg.actions;
      // client-side guard: nothing to decide (only 过) → skip instantly, no countdown
      if (pendingActions.length === 1 && pendingActions[0].kind === "pass") { decide(pendingActions[0].id); break; }
      renderActions(); scheduleRender(); break;
    case "hand_ended": showHandEnd(msg); break;
    case "match_ended": showMatchEnd(msg); break;
    case "error": log("sys","ERROR: "+msg.error); break;
  }
}

function applyEvent(e) {
  if (!snap) return;
  const seat = (s) => snap.seats.find(x => x.seat === s);
  switch (e.kind) {
    case "hand_started": snap.dealer = e.dealer; snap.round_wind = e.round_wind; snap.hand_number = e.hand_number; globalLastDiscard = null; reserveMs = RESERVE_FULL_MS; break;
    case "tile_drawn": { const s = seat(e.seat); if (!s) break;
      s.hand_count = (s.hand_count||0)+1; snap.current_seat = e.seat;
      if (e.tile && e.seat === yourSeat) { (s.hand=s.hand||[]).push(e.tile); snap.last_drawn_tile = e.tile; } break; }
    case "tile_discarded": { const s = seat(e.seat); if (!s) break;
      if (e.tile) { (s.discards=s.discards||[]).push(e.tile); globalLastDiscard = {seat:e.seat, id:e.tile.id}; }
      if (e.seat === yourSeat && e.tile && s.hand) { const i = s.hand.findIndex(t => t.id===e.tile.id); if (i>=0) s.hand.splice(i,1); snap.last_drawn_tile = null; }
      else { s.hand_count = Math.max(0,(s.hand_count||1)-1); }
      if (e.riichi) s.riichi = true; break; }
    case "riichi_declared": { const s = seat(e.seat); if (s) s.riichi = true; flashCall(e.seat, "立直", "riichi"); break; }
    case "meld_formed": { const s = seat(e.seat); if (!s) break;
      (s.melds=s.melds||[]).push({meld_type:e.meld_type, tiles:e.tiles||[], called_from:e.called_from}); globalLastDiscard = null;
      flashCall(e.seat, CALL_LABEL[e.meld_type] || "鸣", e.meld_type==="chi" ? "chi" : "pon"); break; }
  }
}

function faceFile(t) { const su = t.code[0], rk = +t.code.slice(1); if (t.red && RED_FACE[su]) return RED_FACE[su]; return (FACE[su]||[])[rk] || "Front"; }
function makeTile(t) {
  const d = document.createElement("div"); d.className = "tile";
  if (!t) d.classList.add("back"); else d.style.backgroundImage = `url(/tiles/${faceFile(t)}.svg), url(/tiles/Front.svg)`;
  return d;
}
function reconcile(container, items, key, build, decorate) {
  const existing = new Map();
  for (const ch of [...container.children]) existing.set(ch.dataset.k, ch);
  const want = new Set(items.map(key));
  for (const [k, ch] of existing) if (!want.has(k)) ch.remove();
  let prev = null;
  for (const it of items) {
    const k = key(it); let ch = existing.get(k);
    if (!ch) { ch = build(it); ch.dataset.k = k; }
    const ref = prev ? prev.nextSibling : container.firstChild;
    if (ref !== ch) container.insertBefore(ch, ref);
    if (decorate) decorate(ch, it);
    prev = ch;
  }
}

// coalesce bursts of events (AI turns fire many in quick succession) into one paint
let renderQueued = false;
function scheduleRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }

function render() {
  if (!snap) return;
  document.getElementById("gameinfo").innerHTML =
    `规则 <b>${ruleset}</b> · 你 <b>${WINDS[yourSeat+1]||yourSeat}</b> · ${WINDS[snap.round_wind]||""}${snap.hand_number}局 · 余 <b>${snap.wall_count}</b>`;

  // center well: round / remaining wall count / dead-wall with dora
  document.getElementById("wround").textContent = `${WINDS[snap.round_wind]||"?"} ${snap.hand_number}`;
  document.getElementById("wcount").textContent = `山 ${snap.wall_count}`;
  const dw = document.getElementById("deadwall"); dw.innerHTML = "";
  const dora = snap.dora_indicators || [];
  dora.forEach(t => dw.appendChild(makeTile(t)));                       // dora indicators, face up
  const backs = Math.max(0, (snap.dead_wall_count || 0) - dora.length);
  for (let i = 0; i < Math.min(backs, 6); i++) dw.appendChild(makeTile(null));  // rest of dead wall, face down

  for (let rel = 0; rel < 4; rel++) {
    const seatNo = relToSeat(rel), sv = snap.seats.find(s => s.seat===seatNo);
    renderScoreChip(document.querySelector(`.scorechip[data-rel="${rel}"]`), sv, seatNo);
    const st = document.querySelector(`.station[data-rel="${rel}"]`);
    renderPond(st.querySelector(".pond"), sv, seatNo);
    renderMelds(st.querySelector(".melds"), sv, seatNo);
    renderHand(st.querySelector(".hand"), sv, seatNo, rel);
  }
}
function relToSeat(rel) { return ((yourSeat + rel) % 4 + 4) % 4; }
function elc(tag, cls, txt) { const d = document.createElement(tag); if (cls) d.className = cls; if (txt!=null) d.textContent = txt; return d; }

function renderScoreChip(b, sv, seatNo) {
  b.classList.toggle("active", snap.current_seat===seatNo);
  b.classList.toggle("dealer", snap.dealer===seatNo);
  if (sv && sv.riichi && !prevRiichi[seatNo]) { b.classList.remove("anim-riichi"); void b.offsetWidth; b.classList.add("anim-riichi"); }
  if (sv) prevRiichi[seatNo] = sv.riichi;
  if (!sv) { b.innerHTML = ""; b._built = false; return; }
  const sw = ((seatNo - snap.dealer + 4)%4)+1;
  if (!b._built) {  // build stable structure once so the score span survives re-renders (tween)
    b.innerHTML = "";
    b._dot = elc("div","sc-dot"); b._pts = elc("span","sc-pts"); b._rii = elc("span","sc-rii","立");
    b.append(b._dot, b._pts); b._built = true;
  }
  b._dot.className = "sc-dot w"+sw; b._dot.textContent = WINDS[sw];
  b.classList.toggle("me", seatNo===yourSeat);
  b.title = sv.name + (seatNo===yourSeat ? "（你）" : "");
  if (sv.riichi && b._rii.parentNode !== b) b.appendChild(b._rii);
  else if (!sv.riichi && b._rii.parentNode === b) b.removeChild(b._rii);

  const shown = ptsShown[seatNo];
  if (shown == null) { b._pts.textContent = sv.points; ptsShown[seatNo] = sv.points; }
  else if (shown !== sv.points && !scoreTweens[seatNo]) { tweenScore(b, b._pts, seatNo, shown, sv.points); }
  else if (!scoreTweens[seatNo]) { b._pts.textContent = sv.points; }
}
// roll the score from old → new, flashing green (gain) / red (loss)
function tweenScore(chip, span, seatNo, from, to) {
  const dur = 650, start = performance.now();
  chip.classList.remove("gain","loss"); void chip.offsetWidth;
  chip.classList.add(to > from ? "gain" : "loss");
  ptsShown[seatNo] = to;
  function step(now) {
    const p = Math.min(1, (now-start)/dur), e = 1-Math.pow(1-p,3);
    span.textContent = Math.round(from + (to-from)*e);
    if (p < 1) { scoreTweens[seatNo] = requestAnimationFrame(step); }
    else { span.textContent = to; delete scoreTweens[seatNo]; setTimeout(() => chip.classList.remove("gain","loss"), 300); }
  }
  scoreTweens[seatNo] = requestAnimationFrame(step);
}

function renderMelds(container, sv, seatNo) {
  const groups = ((sv&&sv.melds)||[]).map((m,i)=>({ k: seatNo+":m"+(((m.tiles||[])[0]||{}).id ?? i), m }));
  reconcile(container, groups, g => g.k,
    g => { const grp = elc("div","meldgroup anim-meld"); (g.m.tiles||[]).forEach(t => grp.appendChild(makeTile(t))); return grp; });
}

function renderHand(container, sv, seatNo, rel) {
  if (!sv) { container.innerHTML = ""; return; }
  if (sv.hand) {
    const drawnId = snap.last_drawn_tile ? snap.last_drawn_tile.id : null;
    const items = sortHand(sv.hand);
    reconcile(container, items, t => "h"+t.id,
      t => { const el = makeTile(t); if (t.id===drawnId && !animatedDrawIds.has(t.id)) { animatedDrawIds.add(t.id); el.classList.add("anim-draw"); } return el; },
      (el,t) => { el.classList.toggle("drawn", t.id===drawnId);
        const act = discardActionFor(t);
        el.classList.toggle("clickable", !!act);
        el.classList.toggle("dimmed", riichiArmed && !act);   // can't riichi-discard this tile
        el.classList.toggle("sel", isMobile && !!act && selectedTileId===t.id);
        el.onclick = act ? () => onHandTap(t, act) : null; });
  } else {
    const backs = Array.from({length: sv.hand_count||0}, (_,i)=>i);
    reconcile(container, backs, i => "b"+i, () => makeTile(null));
  }
}

function renderPond(grid, sv, seatNo) {
  const ds = (sv && sv.discards) || [];
  reconcile(grid, ds, t => "d"+t.id,
    t => { const el = makeTile(t); if (!seenDiscardIds.has(t.id)) { seenDiscardIds.add(t.id); el.classList.add("anim-in"); } return el; },
    (el,t) => { const isCur = globalLastDiscard && globalLastDiscard.seat===seatNo && globalLastDiscard.id===t.id; el.classList.toggle("cur", !!isCur); });
}
function sortHand(hand) { const order = {m:0,p:1,s:2,z:3};
  return [...hand].sort((a,b)=>{ const sa=order[a.code[0]], sb=order[b.code[0]]; return sa!==sb?sa-sb:(+a.code.slice(1))-(+b.code.slice(1)); }); }

// which action a hand-tile click performs: normal discard, or (when riichi is
// armed) the riichi-discard tied to that tile.
function discardActionFor(tile) {
  if (!pendingActions) return null;
  const kind = riichiArmed ? "riichi" : "discard";
  return pendingActions.find(a => a.kind===kind && a.tiles && a.tiles.some(t => t.id===tile.id));
}
// desktop: click discards directly. mobile: first tap raises/selects the tile,
// second tap on the same tile confirms (tapping another tile moves the selection).
function onHandTap(tile, act) {
  if (!isMobile) { decide(act.id); return; }
  if (selectedTileId === tile.id) decide(act.id);
  else { selectedTileId = tile.id; scheduleRender(); }
}

// Bottom bar holds ONLY special actions (chi/pon/kan/riichi/tsumo/ron/pass).
// Discarding is done by clicking a tile in your hand (Mahjong-Soul style).
function renderActions() {
  const bar = document.getElementById("actionbar"); bar.innerHTML = ""; riichiArmed = false; selectedTileId = null;
  if (!pendingActions || !pendingActions.length) { bar.innerHTML = '<span class="hint">轮到对家 / AI…</span>'; cancelTimer(); return; }

  const hasDiscard = pendingActions.some(a => a.kind==="discard");
  const hasRiichi  = pendingActions.some(a => a.kind==="riichi");
  const others = pendingActions.filter(a => a.kind!=="discard" && a.kind!=="riichi");

  if (hasDiscard || hasRiichi) bar.appendChild(elc("span","hint","点击手牌出牌"));

  if (hasRiichi) {
    const rb = elc("button","act riichi"); rb.textContent = "立直";
    rb.onclick = () => {
      riichiArmed = !riichiArmed; selectedTileId = null; rb.classList.toggle("armed", riichiArmed);
      const h = bar.querySelector(".hint"); if (h) h.textContent = riichiArmed ? "选择要切出的牌 · 立直" : "点击手牌出牌";
      render();
    };
    bar.appendChild(rb);
  }

  others.forEach(a => {
    const b = elc("button","act");
    if (a.kind==="pass") b.classList.add("pass");
    else if (a.kind==="tsumo"||a.kind==="ron") b.classList.add("win");
    else if (a.kind==="chi"||a.kind==="pon"||a.kind==="kan") b.classList.add("call");
    let label = KIND_LABEL[a.kind] || a.kind;
    if (a.kind==="kan" && a.extra && a.extra.kan_kind) label += `(${a.extra.kan_kind})`;
    b.appendChild(document.createTextNode(label));
    if (a.tiles && a.tiles.length) { const mini = elc("span","mini"); a.tiles.forEach(t => mini.appendChild(makeTile(t))); b.appendChild(mini); }
    b.onclick = () => decide(a.id); bar.appendChild(b);
  });
  startTimerForDecision(bar);
}
function decide(actionId) {
  cancelTimer(); riichiArmed = false; selectedTileId = null; send({type:"decide", action_id: actionId}); pendingActions = null;
  document.getElementById("actionbar").innerHTML = '<span class="hint">已出招，等待…</span>'; render();
}

let fuseRAF = null;
function cancelTimer() { if (fuseRAF) { cancelAnimationFrame(fuseRAF); fuseRAF = null; } }
function startTimerForDecision(bar) {
  cancelTimer();
  if (!document.getElementById("timerOn").checked) return;
  const isResponse = pendingActions.some(a => a.kind==="pass");
  const onExpire = () => { if (!pendingActions) return; let pick;
    if (isResponse) pick = pendingActions.find(a => a.kind==="pass");
    else { const ds = pendingActions.filter(a => a.kind==="discard"); pick = ds.length ? ds[Math.floor(Math.random()*ds.length)] : pendingActions[0]; }
    if (pick) decide(pick.id); };

  const wrap = elc("div","fuse-wrap");
  const ftxt = elc("span","ftxt", isResponse ? "吃/碰/杠/和" : "出牌");
  const fuse = elc("div","fuse"); const char = elc("div","char"); const flame = elc("span","flame"); flame.textContent = "🔥";
  fuse.append(char, flame); const secs = elc("span","secs");
  wrap.append(ftxt, fuse, secs); bar.appendChild(wrap);

  let last = performance.now(), baseLeft = BASE_MS;
  function tick(now) {
    const dt = now - last; last = now;
    if (baseLeft > 0) baseLeft -= dt; else reserveMs -= dt;
    const inReserve = baseLeft <= 0;
    if (inReserve) {
      fuse.classList.add("reserve");
      const p = Math.max(0, reserveMs) / RESERVE_FULL_MS;
      char.style.width = (1-p)*100+"%"; flame.style.left = p*100+"%";
      secs.textContent = "长考 " + (Math.max(0,reserveMs)/1000).toFixed(1)+"s";
    } else {
      const p = baseLeft / BASE_MS;
      char.style.width = (1-p)*100+"%"; flame.style.left = p*100+"%";
      secs.textContent = (baseLeft/1000).toFixed(1)+"s";
    }
    if (inReserve && reserveMs <= 0) { reserveMs = 0; fuseRAF = null; onExpire(); return; }
    fuseRAF = requestAnimationFrame(tick);
  }
  fuseRAF = requestAnimationFrame(tick);
}

// Mahjong-Soul-style call banner: big text flashes on the caller's side
function flashCall(seatNo, text, kind) {
  const felt = document.getElementById("felt"); if (!felt) return;
  const rel = ((seatNo - yourSeat) % 4 + 4) % 4;
  const wrap = elc("div","cbwrap rel"+rel);
  const b = elc("div","callbanner cb-"+(kind||""), text);
  wrap.appendChild(b); felt.appendChild(wrap);
  setTimeout(() => wrap.remove(), 1100);
}

let overlayTimer = null;
function showHandEnd(m) {
  const card = document.getElementById("overlayCard");
  if (m.result === "drawn") {
    const reason = m.abort_reason ? (ABORT_NAMES[m.abort_reason]||m.abort_reason) : "荒牌流局";
    card.innerHTML = `<h2>流局</h2><div class="sub">${reason}</div>`;
  } else {
    const winners = (m.winners&&m.winners.length?m.winners:[m.winner]).filter(s=>s!=null);
    winners.forEach(s => flashCall(s, m.loser!=null?"荣和":"自摸", m.loser!=null?"ron":"tsumo"));
    const who = winners.map(s=>seatNames[s]||s).join("、");
    const via = m.loser!=null ? `荣和（放铳：${seatNames[m.loser]||m.loser}）` : "自摸";
    let yakuHtml = "";
    if (m.yaku && m.yaku.length) yakuHtml = '<div class="yaku">' + m.yaku.map(y=>`<div><span>${y[0]}</span><span>${y[1]}番</span></div>`).join("") + "</div>";
    const hf = (m.han!=null) ? `${m.han}番 ${m.fu?m.fu+"符":""}` : "";
    card.innerHTML = `<h2>${who} 和了</h2><div class="sub">${via} · ${hf}</div>${yakuHtml}<div class="big">${m.score} 点</div>`;
  }
  showOverlay(2800);
}
function showMatchEnd(m) {
  const card = document.getElementById("overlayCard");
  const rows = Object.entries(m.final_points).sort((a,b)=>b[1]-a[1])
    .map(([s,p],i)=>`<tr><td>${i+1}位</td><td>${seatNames[s]||s}</td><td style="text-align:right">${p}</td></tr>`).join("");
  card.innerHTML = `<h2>对局结束</h2><table>${rows}</table><div class="sub" style="margin-top:10px">共 ${m.hand_results.length} 局</div><button class="ctl" style="margin-top:12px" onclick="hideOverlay()">关闭</button>`;
  showOverlay(0);
}
function showOverlay(autoHideMs) { document.getElementById("overlay").classList.add("show"); if (overlayTimer) clearTimeout(overlayTimer); if (autoHideMs) overlayTimer = setTimeout(hideOverlay, autoHideMs); }
function hideOverlay() { document.getElementById("overlay").classList.remove("show"); }

document.getElementById("snapBtn").onclick = () => send({type:"request_snapshot"});
document.getElementById("reconnectBtn").onclick = () => { if (ws) try { ws.close(); } catch {} ; setTimeout(connect,200); };
document.getElementById("clearLog").onclick = () => { logEl.innerHTML = ""; };
document.getElementById("logBtn").onclick = (e) => { const p = document.getElementById("logpanel"); p.classList.toggle("hidden"); e.target.textContent = p.classList.contains("hidden")?"显示日志":"隐藏日志"; };
document.getElementById("overlay").onclick = (e) => { if (e.target.id==="overlay") hideOverlay(); };

// mobile: hide the debug log drawer by default; show a one-time rotate hint in portrait
const isMobile = window.matchMedia("(max-width: 900px), (pointer: coarse)").matches;
if (isMobile) {
  const lp = document.getElementById("logpanel"); lp.classList.add("hidden");
  document.getElementById("logBtn").textContent = "显示日志";
  const rh = document.getElementById("rotateHint");
  rh.classList.add("on");
  rh.onclick = () => rh.classList.remove("on");
}

// ── asset preload ── show the loading bar only the FIRST time (or when the tile
// pack changes). Bump ASSET_VERSION whenever the SVGs under /tiles/ are updated.
const ASSET_VERSION = "fluffystuff-1";
function allAssetUrls() {
  const names = new Set(["Front", "Back"]);
  for (const su of ["m","p","s"]) for (let r = 1; r <= 9; r++) names.add(FACE[su][r]);
  for (const z of FACE.z) if (z) names.add(z);
  for (const k in RED_FACE) names.add(RED_FACE[k]);
  return [...names].map(n => `/tiles/${n}.svg`);
}
function preloadAssets() {
  const urls = allAssetUrls(); let done = 0;
  const fill = document.getElementById("loadfill"), pct = document.getElementById("loadpct");
  const bump = () => { done++; const p = Math.round(done/urls.length*100); fill.style.width = p+"%"; pct.textContent = p+"%"; };
  return Promise.all(urls.map(u => new Promise(res => { const img = new Image(); img.onload = img.onerror = () => { bump(); res(); }; img.src = u; })));
}
const ld = document.getElementById("loading");
let cachedVer = null;
try { cachedVer = localStorage.getItem("avid_assets_ver"); } catch {}
if (cachedVer === ASSET_VERSION) {
  // already downloaded this pack before → no loading bar; warm cache silently
  ld.style.display = "none";
  allAssetUrls().forEach(u => { const i = new Image(); i.src = u; });
  connect();
} else {
  preloadAssets().then(() => {
    try { localStorage.setItem("avid_assets_ver", ASSET_VERSION); } catch {}
    ld.classList.add("done");
    setTimeout(() => { ld.style.display = "none"; }, 450);
    connect();
  });
}
</script>
</body>
